        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  # ──────────────────────────────────────────────────────────────────────
  # URL INSPECTION — 2 shards, 900 inspections each = 1,800/day.
  #
  # Google's cap is 10,000/DAY PER CLOUD PROJECT across every property and
  # every shard. 1,800 is 18% of it. If you add a third shard you are adding
  # 900 more calls/day to a SHARED budget — check the numbers first.
  #
  # 05:10 UTC, after the performance sync so a freshly verified property is
  # already eligible on the same night.
  # ──────────────────────────────────────────────────────────────────────
  - type: cron
    name: netgrid-cron-gsc-coverage-0
    runtime: docker
    schedule: "10 5 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-index-coverage?shard=0&shardCount=2
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  - type: cron
    name: netgrid-cron-gsc-coverage-1
    runtime: docker
    schedule: "10 5 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-index-coverage?shard=1&shardCount=2
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  # Suppressed-or-unindexed alert — weekly, Monday 06:00 UTC. limit=0 means
  # "run the alert query and send the email, sync nothing"; the four sync
  # services above have already run by then.
  - type: cron
    name: netgrid-cron-gsc-alert
    runtime: docker
    schedule: "0 6 * * 1"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-sync?alert=1&limit=0
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
