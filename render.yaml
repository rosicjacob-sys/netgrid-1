  # ──────────────────────────────────────────────────────────────────────
  # T03 — LINK-EXCHANGE REMOVAL. TEMPORARY SERVICE.
  #
  # The link-exchange cron (netgrid-cron-link-exchange) was deleted here and
  # its route now returns 410. This service drains link_exchange_removals:
  # for each queued published post it fetches the live body, strips any
  # data-nx-exch link, and pushes the body back.
  #
  # Every 10 minutes at limit=50 clears ~7,200 posts/day, so a few thousand
  # posts drain within hours. Idempotent and restartable — a run that is
  # killed mid-batch simply resumes from the queue.
  #
  # DELETE THIS SERVICE once the queue is empty:
  #   SELECT count(*) FROM link_exchange_removals
  #    WHERE status = 'pending' OR (status = 'failed' AND attempts < 5);
  # It is not a permanent part of the platform.
  # ──────────────────────────────────────────────────────────────────────
  - type: cron
    name: netgrid-cron-link-exchange-removal
    runtime: docker
    schedule: "*/10 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/link-exchange-removal?limit=50
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  # Semantic linking backfill: embed published posts missing a vector, then
  # link them in two lanes — never-linked posts, and already-linked posts whose
  # blog has published something newer (see runSemanticLinkingBackfill).
  #
  # New posts are linked immediately on publish now that the hook fires on the
  # cron path too (T16), so the NEW lane mostly catches hook failures. The
  # REFRESH lane is what keeps the graph bidirectional over time.
  #
  # Every 20 minutes at limit=150: ~214 publishes/day need a first link, and
  # the rest of the budget goes to refreshing. At :05/:25/:45 it avoids the
  # on-the-hour publish crons and the :07-:52 keyword shards.
  - type: cron
    name: netgrid-cron-semantic-linking
    runtime: docker
    schedule: "5,25,45 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/semantic-linking?limit=150
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false

  # Indexing sweep (T15): submit missing/stale sitemaps to Google Search
  # Console and re-verify IndexNow key files. Daily at 04:10 UTC — off the
  # hour so it never overlaps the four auto-publish shards, and clear of the
  # :05/:25/:45 semantic-linking runs and the :07-:52 keyword shards.
  #
  # This sweep is the DURABLE path for sitemap submission; the hook in
  # createBlog is fire-and-forget and can be cut short when the request ends.
  - type: cron
    name: netgrid-cron-index-submit
    runtime: docker
    schedule: "10 4 * * *"
    dockerfilePath: ./cron/Dockerfile
