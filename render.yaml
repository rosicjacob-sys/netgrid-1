services:
  - type: web
    name: netgrid
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    # Apply any pending DB migrations after build, before the new version
    # goes live. Idempotent runner (src/lib/db/migrate.mjs) — a failure here
    # blocks the deploy instead of shipping code against an un-migrated DB.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CRAWL_DELAY_MS
        value: "2000"
      - key: MAX_CONCURRENT_CRAWLS
        value: "5"
      - key: CRAWL_WINDOW_START
        value: "02:00"
      - key: CRAWL_WINDOW_END
        value: "06:00"
      - key: POST_CHECK_INTERVAL_HOURS
        value: "6"
      # Pipeline telemetry (T22). TELEMETRY_ENABLED=0 is the rollback lever —
      # it turns every cron_runs / pipeline_errors write into a no-op without
      # a code deploy; counters still accumulate in memory and every
      # recordPipelineError still emits its console line.
      # TELEMETRY_BACKGROUND_WAIT_MS caps how long a run waits for detached
      # IndexNow / post-scan work before flushing its row.
      - key: TELEMETRY_ENABLED
        value: "1"
      - key: TELEMETRY_BACKGROUND_WAIT_MS
        value: "15000"
      # Pipeline alerts (T22). ALERT_EMAIL_TO is a comma-separated recipient
      # list; alerts are evaluated and logged but NOT delivered while it is
      # unset. These must live on the WEB service — the alert route runs
      # there, not in the cron container, and the two have separate env sets.
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_SUPPRESS_HOURS
        value: "6"
      # Article-generation output-token budget (T06). Both optional — the code
      # defaults to 8192 / 180000. DEEPSEEK_MAX_OUTPUT_TOKENS must not exceed
      # the real max_tokens of whatever DEEPSEEK_MODEL points at; verify at
      # https://api-docs.deepseek.com before raising it.
      - key: DEEPSEEK_MAX_OUTPUT_TOKENS
        sync: false
      - key: DEEPSEEK_TIMEOUT_MS
        sync: false
      # Scrubber publish gate (T07). off | shadow | enforce.
      # Ships as "shadow": the verdict is logged, the post still publishes.
      # Flip to "enforce" only after a week of shadow data shows what
      # fraction of the network the gate would actually stop.
      - key: SCRUBBER_ENFORCEMENT
        value: shadow
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Semantic linking (cosine-similarity related posts). OPENAI_API_KEY
      # powers the text-embedding-3-small vectors; SHOPIFY_WEBHOOK_SECRET
      # verifies articles/create|update webhooks. Threshold/max are optional
      # (defaults 0.75 / 5).
      - key: OPENAI_API_KEY
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SEMANTIC_LINK_THRESHOLD
        sync: false
      - key: SEMANTIC_LINK_MAX
        sync: false
      # Hybrid dense+sparse blend weight (sparse share). Default 0.3.
      - key: SEMANTIC_LINK_ALPHA
        sync: false
      # Embedding backend: "openai" (default) or "local" (not yet implemented).
      - key: EMBEDDING_MODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: AHREFS_API_KEY
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      # Real search volume for the per-client keyword pool (client_keywords),
      # admin-triggered on demand from the client's Keywords tab — NOT wired
      # into any cron, since a pull costs real money unlike the free
      # Autocomplete scrape. LOGIN/PASSWORD are API credentials from the
      # DataForSEO dashboard, not the account password. MAX_RUN_COST caps
      # spend per pull in USD; optional, defaults to 5.00.
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: DATAFORSEO_MAX_RUN_COST
        sync: false
      # ── Google Search Console (T04) ──
      # The service account that owns every client property. EMAIL is the
      # client_email from the JSON key; PRIVATE_KEY is the PEM with literal \n
      # escapes (a base64-encoded PEM is also accepted). These belong on the WEB
      # service only — cron services just curl this service (cron/invoke.sh),
      # so a GSC var set on a cron service has no effect.
      #
      # Unset either one and every GSC route no-ops with a 200. That is the
      # kill switch: no deploy needed to stop the subsystem.
      - key: GSC_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GSC_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      # Operator inbox for the weekly suppressed-or-unindexed alert. Unset means
      # the query still runs and returns JSON; no email is sent.
      - key: GSC_ALERT_EMAIL
        sync: false
      - key: GSC_SYNC_CONCURRENCY
        value: "5"
      # URL Inspection is capped at 10,000 calls/DAY per Cloud PROJECT across
      # ALL properties and ALL shards. 900 x 2 shards = 1,800/day = 18% of the
      # cap. Raise deliberately; see gsc-index-coverage.ts for the arithmetic.
      - key: GSC_URL_INSPECT_DAILY_BUDGET
        value: "900"
      - key: GSC_URL_INSPECT_PER_SITE
        value: "4"
      # T03 removal job: delay in ms between live-post writes. Default 250.
      # Raise it if a Shopify store starts returning 429s.
      - key: LINK_EXCHANGE_REMOVAL_THROTTLE_MS
        sync: false
      # Auto-publish sizing (T08). 36 blogs at concurrency 3 is 12 waves of
      # at most 35s ~= 420s, leaving ~180s of the route's 600s maxDuration
      # for in-tick retries and the sweep's own queries. The code default of
      # 50 needs 595s before any retry and does not fit. Capacity at 36:
      # 36 x 4 shards x 24h = 3,456 posts/day, well above the ~1,500/day peak
      # this network is designed for.
      - key: MAX_BLOGS_PER_CRON_RUN
        value: "36"
      # 4 shards x 3 = 12 in-flight publishes = 36 RPM against Anthropic's
      # 50 and 24 RPM against Google's 60. Do not raise this to buy time —
      # 4 would put Claude at 48 of 50 RPM with no margin.
      - key: AUTO_PUBLISH_CONCURRENCY
        value: "3"
      # Age at which an in-flight generated_posts row is considered abandoned
      # and its day slot released (T08). 3x the longest legitimate lifetime.
      - key: PUBLISH_REAPER_MINUTES
        value: "30"
      # ── Post-verification sweep (T18) ─────────────────────────────────
      # Read by /api/cron/post-verification. These belong on the WEB
      # service: a cron service's env vars are consumed by curl in the cron
      # container and never reach the request handler. Anything the handler
      # needs per-shard travels in CRON_PATH's query string instead.
      - key: POST_VERIFICATION_CONCURRENCY
        value: "6"
      - key: POST_VERIFICATION_LIMIT
        value: "600"
      # Stop dispatching new blogs at 240s. Must stay below maxDuration
      # (300s) which must stay below CRON_MAX_TIME (330s).
      - key: POST_VERIFICATION_BUDGET_MS
        value: "240000"
      - key: POST_VERIFICATION_RETENTION_DAYS
        value: "30"
      - key: POST_VERIFICATION_PRUNE_BATCH
        value: "5000"
      # Alert thresholds. Coverage is verified/eligible per shard.
      - key: POST_VERIFICATION_MIN_COVERAGE_PCT
        value: "90"
      - key: POST_VERIFICATION_BEHIND_ALERT
        value: "10"
      - key: POST_VERIFICATION_SILENT_DAYS
        value: "14"
      # Ops inbox for coverage / silent-blog alerts. Unset = log +
      # activity_log only, no email.
      - key: ALERT_EMAIL_TO
        sync: false
      - key: CRON_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────────────────
  # SEO SCAN — once-per-month per blog.
  #
  # The route enforces a strict once-per-month boundary in SQL: blogs
  # scanned this calendar month are EXCLUDED from the candidate query
  # automatically. So even though the rush cron fires hourly for 7
  # days (168 runs), each individual blog gets exactly one scan per
  # month. Once everyone is covered, subsequent runs return
  # "all active blogs already scanned this month" with zero work.
  #
  # Capacity:
  #   168 runs × 20 blogs = 3,360 scan slots per month
  #   → comfortably covers a 3,000-blog network
  #
  # Reporting flow:
  #   Day 25-31 — rush scans every blog once, writes lastSeoScanAt
  #   Day 1, 09:00 PH — monthly-reports cron reads fresh per-blog
  #                     scores into the PDF
  #
  # Manual catch-up: hit /api/cron/seo-scan?force=1&limit=20 to ignore
  # the once-per-month filter (useful after onboarding new blogs
  # mid-month).
  # ──────────────────────────────────────────────────────────────────────

  - type: cron
    name: netgrid-cron-seo-scan-rush
    runtime: docker
    schedule: "0 * 25-31 * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/seo-scan?limit=20&concurrency=5
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "360"

  # ──────────────────────────────────────────────────────────────────────
  # POST VERIFICATION — 4-way SHARDED, same hash partition as auto-publish
  # (shardForBlog in src/lib/cron/sharding.ts). Every blog is in exactly one
  # shard, so no blog is checked twice and none is skipped.
  #
  # Every 6h, aligned to PH morning: 02 / 08 / 14 / 20 PH.
  # 02 PH = 18 UTC (prev day), 08 PH = 00 UTC, 14 PH = 06 UTC, 20 PH = 12 UTC.
  #
  # Minutes 05/07/09/11 rather than :00 — the four auto-publish shards fire
  # on the hour and can each run for up to 600s, and semantic-linking runs
  # at :20. Minutes 5-11 are otherwise unused.
  #
  # Capacity (1,500 active blogs, concurrency 6 set on the WEB service):
  #   375 blogs per shard; ~56s typical, ~190s pessimistic per run.
  #   Server-side budget 240s < maxDuration 300s < CRON_MAX_TIME 330s.
  #
  # CRON_MAX_TIME MUST stay above the route's own budget: cron/invoke.sh
  # runs curl with retries, and curl treats --max-time expiry as a transient
  # error, so a too-small value produces OVERLAPPING sweeps instead of one
  # clean failure. That is what the previous unsharded service did.
  #
  # Shard 0 also runs the post_verifications retention prune.
  # ──────────────────────────────────────────────────────────────────────
  - type: cron
    name: netgrid-cron-post-verification-0
    runtime: docker
    schedule: "5 0,6,12,18 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/post-verification?shard=0&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "330"

  - type: cron
    name: netgrid-cron-post-verification-1
    runtime: docker
    schedule: "7 0,6,12,18 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/post-verification?shard=1&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "330"

  - type: cron
    name: netgrid-cron-post-verification-2
    runtime: docker
    schedule: "9 0,6,12,18 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/post-verification?shard=2&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "330"

  - type: cron
    name: netgrid-cron-post-verification-3
    runtime: docker
    schedule: "11 0,6,12,18 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/post-verification?shard=3&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "330"

  # Monthly reports — 09:00 PH on the 1st of each month.
  # 09:00 PH = 01:00 UTC same day. PDFs land in client inboxes around
  # 9am-10am PH local working hours.
  - type: cron
    name: netgrid-cron-monthly-reports
    runtime: docker
    schedule: "0 1 1 * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/monthly-reports
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────────────────
  # Auto-publish — 4-way SHARDED. Each blog's UUID is hashed and assigned
  # to exactly one shard (shardForBlog in content-generation-actions.ts).
  # Running four parallel cron services means four times the throughput:
  #
  #   1 shard,  hourly  → ~16-20 blogs/hour →   ~400 posts/day max
  #   4 shards, hourly  → ~64-80 blogs/hour →  ~1,600 posts/day max
  #
  # At 3,500 sites posting weekly (= 500/day average, up to 1,500/day if
  # weekdays cluster), four shards gives enough headroom. Each shard is
  # an independent cron service — drop or add shards later by editing
  # this file. The hash partition guarantees no two shards ever process
  # the same blog (no double-posts).
  #
  # Schedule is hourly UTC (timezone-invariant). Each blog still has its
  # own preferredHour internal slot — the cron just gates when shards
  # can do work.
  # ──────────────────────────────────────────────────────────────────────

  - type: cron
    name: netgrid-cron-auto-publish-0
    runtime: docker
    schedule: "0 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/auto-publish?shard=0&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      # Above the route's maxDuration of 600s, never below: a curl
      # timeout re-invokes a handler that is still running. See T08.
      - key: CRON_MAX_TIME
        value: "900"
      # No retries on an hourly publish sweep. The DB guard makes a
      # re-invocation harmless, but it still burns a 600s function slot
      # and doubles API pressure; a missed tick is picked up an hour
      # later by the deferred queue.
      - key: CRON_RETRY
        value: "0"

  - type: cron
    name: netgrid-cron-auto-publish-1
    runtime: docker
    schedule: "0 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/auto-publish?shard=1&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      # Above the route's maxDuration of 600s, never below: a curl
      # timeout re-invokes a handler that is still running. See T08.
      - key: CRON_MAX_TIME
        value: "900"
      # No retries on an hourly publish sweep. The DB guard makes a
      # re-invocation harmless, but it still burns a 600s function slot
      # and doubles API pressure; a missed tick is picked up an hour
      # later by the deferred queue.
      - key: CRON_RETRY
        value: "0"

  - type: cron
    name: netgrid-cron-auto-publish-2
    runtime: docker
    schedule: "0 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/auto-publish?shard=2&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      # Above the route's maxDuration of 600s, never below: a curl
      # timeout re-invokes a handler that is still running. See T08.
      - key: CRON_MAX_TIME
        value: "900"
      # No retries on an hourly publish sweep. The DB guard makes a
      # re-invocation harmless, but it still burns a 600s function slot
      # and doubles API pressure; a missed tick is picked up an hour
      # later by the deferred queue.
      - key: CRON_RETRY
        value: "0"

  - type: cron
    name: netgrid-cron-auto-publish-3
    runtime: docker
    schedule: "0 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/auto-publish?shard=3&shardCount=4
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      # Above the route's maxDuration of 600s, never below: a curl
      # timeout re-invokes a handler that is still running. See T08.
      - key: CRON_MAX_TIME
        value: "900"
      # No retries on an hourly publish sweep. The DB guard makes a
      # re-invocation harmless, but it still burns a 600s function slot
      # and doubles API pressure; a missed tick is picked up an hour
      # later by the deferred queue.
      - key: CRON_RETRY
        value: "0"

  # Schedule: 06:00 PH every Tuesday.
  # 06:00 PH Tue = 22:00 UTC Mon.
  # ISO weekday in cron: 1=Mon → "0 22 * * 1".
  - type: cron
    name: netgrid-cron-refresh-news
    runtime: docker
    schedule: "0 22 * * 1"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/refresh-news
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false

  # Re-scrape per-client keyword sets (Google Autocomplete) so the keywords
  # bound to content generation stay fresh. Weekly, 03:00 UTC Monday — off-peak
  # and staggered from the news refresh.
  - type: cron
    name: netgrid-cron-refresh-keywords
    runtime: docker
    schedule: "0 3 * * 1"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/refresh-keywords
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────────────────
  # T03 — LINK-EXCHANGE REMOVAL. TEMPORARY SERVICE.
  #
  # The link-exchange cron (netgrid-cron-link-exchange) was deleted here and
  # its route now returns 410. This service drains link_exchange_removals:
  # for each queued published post it fetches the live body, strips any
  # data-nx-exch link, and pushes the body back.
  #
  # Every 10 minutes at limit=50 clears ~7,200 posts/day, so a few thousand
  # posts drain within hours. Idempotent and restartable — a run that is
  # killed mid-batch simply resumes from the queue.
  #
  # DELETE THIS SERVICE once the queue is empty:
  #   SELECT count(*) FROM link_exchange_removals
  #    WHERE status = 'pending' OR (status = 'failed' AND attempts < 5);
  # It is not a permanent part of the platform.
  # ──────────────────────────────────────────────────────────────────────
  - type: cron
    name: netgrid-cron-link-exchange-removal
    runtime: docker
    schedule: "*/10 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/link-exchange-removal?limit=50
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  # Semantic linking backfill: embed published posts missing a vector, then
  # inject "Related posts" links into posts not yet linked. New posts are
  # linked immediately on publish; this drains history in capped batches.
  # Hourly at :20 so it doesn't collide with the on-the-hour publish crons.
  - type: cron
    name: netgrid-cron-semantic-linking
    runtime: docker
    schedule: "20 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/semantic-linking?limit=40
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────────────────
  # PIPELINE ALERTS (T22) — every 30 minutes.
  #
  # Evaluates the thresholds in src/lib/services/pipeline-alerts.ts against
  # cron_runs / pipeline_errors and emails ALERT_EMAIL_TO. Per-key
  # suppression (ALERT_SUPPRESS_HOURS, default 6) prevents a stuck
  # condition from mailing every half hour. 30 min is fast enough to catch
  # a fleet outage inside one publish cycle and slow enough that the
  # aggregate queries are free.
  # ──────────────────────────────────────────────────────────────────────
  - type: cron
    name: netgrid-cron-alerts
    runtime: docker
    schedule: "*/30 * * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/alerts
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "180"

  # ──────────────────────────────────────────────────────────────────────
  # GOOGLE SEARCH CONSOLE — daily performance sync, 4-way SHARDED.
  #
  # Sharding works exactly like auto-publish: each cron service encodes its
  # shard in CRON_PATH, and gscShardForBlog(blog.id, 4) assigns every blog to
  # exactly one shard forever. The four shards are disjoint, so no property is
  # ever pulled twice in a tick.
  #
  # Capacity: one searchanalytics call + one small upsert per blog, ~0.5-2s,
  # at concurrency 5.
  #   1,500 verified blogs / 4 shards =  375 per shard  -> ~200-300s   OK
  #   3,500 verified blogs / 4 shards =  875 per shard  -> ~500-700s   TIGHT
  #
  # At the 3,500-blog target duplicate these blocks to 8 shards and change
  # shardCount in every CRON_PATH. Nothing else changes.
  #
  # Self-healing: candidates are ordered gsc_last_synced_at ASC NULLS FIRST, so
  # a shard that runs out of time resumes where it stopped instead of
  # restarting from the top.
  #
  # Schedule 04:30 UTC — clear of auto-publish (:00) and semantic-linking (:20).
  # Search Console publishes new data once a day, so a single daily tick is all
  # that is useful.
  #
  # shard 0 also carries ?verify=1, which retries property provisioning for
  # blogs that are not verified yet — CSV-imported blogs and WordPress blogs
  # whose DNS TXT record has since been published.
  # ──────────────────────────────────────────────────────────────────────
  - type: cron
    name: netgrid-cron-gsc-sync-0
    runtime: docker
    schedule: "30 4 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-sync?shard=0&shardCount=4&limit=500&verify=1
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  - type: cron
    name: netgrid-cron-gsc-sync-1
    runtime: docker
    schedule: "30 4 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-sync?shard=1&shardCount=4&limit=500
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  - type: cron
    name: netgrid-cron-gsc-sync-2
    runtime: docker
    schedule: "30 4 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-sync?shard=2&shardCount=4&limit=500
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: CRON_MAX_TIME
        value: "660"

  - type: cron
    name: netgrid-cron-gsc-sync-3
    runtime: docker
    schedule: "30 4 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/gsc-sync?shard=3&shardCount=4&limit=500
