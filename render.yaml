  # ──────────────────────────────────────────────────────────────────────
  # URL INSPECTION — 2 shards, 900 inspections each = 1,800/day.
  #
  # Google's cap is 10,000/DAY PER CLOUD PROJECT across every property and
  # every shard. 1,800 is 18% of it. If you add a third shard you are adding
  # 900 more calls/day to a SHARED budget — check the numbers first.
  #
  # 05:10 UTC, after the performance sync so a freshly verified property is
  # already eligible on the same night.
